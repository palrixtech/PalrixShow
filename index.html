<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Palrix Fashion — Showcase</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
</head>
<body class="showcase-body">

  <div class="showcase-app" id="showcaseApp">
    
    <!-- Top Header (No back button, direct showcase experience) -->
    <header class="showcase-header">
      <div class="header-left">
        <div class="seller-info">
          <div class="seller-logo" id="sellerLogo">P</div>
          <span class="seller-name" id="sellerName">Loading...</span>
        </div>
      </div>
      <div class="header-right">
        <span class="product-counter" id="productCounter">0 / 0</span>
      </div>
    </header>

    <!-- Category Filter Bar (Horizontal Pill Selector) -->
    <div class="category-bar" id="categoryBar" style="display: none;">
      <button class="category-tab active" data-filter="all">All</button>
      <button class="category-tab" data-filter="new">New Arrivals</button>
      <button class="category-tab" data-filter="stock">Limited Stock</button>
      <button class="category-tab" data-filter="sold">Most Sold</button>
      <button class="category-tab" data-filter="liked">Most Liked</button>
    </div>

    <!-- Reels Scroll Container -->
    <div class="feed-container" id="feedContainer">
      <!-- Loading State -->
      <div class="state-container" id="loadingState">
        <div class="state-icon"><i class="bi bi-arrow-repeat spin"></i></div>
        <div class="state-title">Loading Catalogue</div>
        <div class="state-desc">Setting up your immersive vertical shopping experience...</div>
      </div>
    </div>

    <!-- Toast popup for copy actions -->
    <div class="toast-msg" id="shareToast">Link copied to clipboard</div>

  </div>

  <!-- Scripts -->
  <script src="js/data.js"></script>
  <script src="js/actions.js"></script>
  <script src="js/showcase.js"></script>
</body>
</html>
